[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactproof"
version = "0.1.0"
description = "Causal validation for AI-generated software artifacts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.scripts]
artifactproof = "artifactproof.cli:main"
artifactproof-synthetic = "artifactproof.synthetic.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
